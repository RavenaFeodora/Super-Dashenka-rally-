<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sprite Hunter: Magic Recovery AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        /* Прицел */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border: 2px solid rgba(0, 255, 0, 0.5); border-radius: 50%;
        }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }
        
        /* Эффекты экрана */
        .muzzle-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 200; }
        .heal-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 255, 100, 0.3); opacity: 0; pointer-events: none; z-index: 190; transition: opacity 0.2s; }
        .damage-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.8); opacity: 0; pointer-events: none; z-index: 150; }

        /* HUD */
        .hud-panel { background: rgba(0, 0, 0, 0.7); border: 1px solid #0f0; padding: 10px; color: #0f0; border-radius: 4px; }
        .hp-bar-container { width: 200px; height: 20px; background: #333; border: 1px solid #555; position: relative; overflow: hidden; }
        #hp-fill { width: 100%; height: 100%; background: #ef4444; transition: width 0.3s; }
        
        @keyframes pulse-red {
            0% { opacity: 0; }
            50% { opacity: 0.5; }
            100% { opacity: 0; }
        }
        .taking-damage { animation: pulse-red 0.5s infinite; }
    </style>
</head>
<body>

    <div id="flash" class="muzzle-flash"></div>
    <div id="heal-overlay" class="heal-flash"></div>
    <div id="damage-overlay" class="damage-flash"></div>

    <div id="ui">
        <!-- Верхний HUD -->
        <div class="flex justify-between p-4">
            <div class="hud-panel">
                <div class="text-[10px]">ВРАГИ</div>
                <div id="count" class="text-xl font-bold">0</div>
            </div>
            <div class="hud-panel text-right">
                <div class="text-[10px]">СЧЕТ</div>
                <div id="score" class="text-xl font-bold">0</div>
            </div>
        </div>

        <!-- Центральный прицел -->
        <div id="crosshair"></div>

        <!-- Нижний HUD (Здоровье) -->
        <div class="absolute bottom-6 left-6 flex flex-col gap-1">
            <div class="text-[#ef4444] text-xs font-bold tracking-widest">ЗДОРОВЬЕ (HP)</div>
            <div class="hp-bar-container">
                <div id="hp-fill"></div>
            </div>
            <div id="hp-text" class="text-white text-sm">100 / 100</div>
        </div>

        <!-- Кнопка действия -->
        <div class="absolute bottom-6 right-6">
            <button id="action-btn" class="interactive bg-red-600 text-white px-8 py-4 rounded font-bold border-b-4 border-red-900 active:border-b-0 active:translate-y-1">
                СТАРТ
            </button>
        </div>

        <!-- Game Over Экран -->
        <div id="game-over" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center pointer-events-auto">
            <h1 class="text-red-600 text-6xl font-black italic mb-4">GAME OVER</h1>
            <p id="final-score" class="text-white text-xl mb-8">Счет: 0</p>
            <button onclick="location.reload()" class="bg-white text-black px-10 py-4 font-bold rounded">ПЕРЕЗАГРУЗКА</button>
        </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        <a-assets>
            <img id="enemy-img" src="InShot_20260401_114755983.png">
            <img id="bonus-img" src="InShot_20260401_183130068.png">
            <audio id="shot-sound" src="single-pistol-shot.mp3" preload="auto"></audio>
            <audio id="magic-sound" src="appearance-of-a-magic-item.mp3" preload="auto"></audio>
        </a-assets>

        <!-- Камера -->
        <a-entity id="camera" camera look-controls raycaster="objects: .target; interval: 100"></a-entity>

        <a-entity id="world"></a-entity>
    </a-scene>

    <script>
        const state = {
            hp: 100,
            score: 0,
            active: false,
            enemyCount: 0
        };

        const actionBtn = document.getElementById('action-btn');
        const hpFill = document.getElementById('hp-fill');
        const hpText = document.getElementById('hp-text');
        const scoreEl = document.getElementById('score');
        const countEl = document.getElementById('count');
        const world = document.getElementById('world');
        const camera = document.getElementById('camera');
        const flash = document.getElementById('flash');
        const healOverlay = document.getElementById('heal-overlay');
        const damageOverlay = document.getElementById('damage-overlay');
        
        const shotSound = document.getElementById('shot-sound');
        const magicSound = document.getElementById('magic-sound');

        actionBtn.addEventListener('click', () => {
            if (!state.active) {
                startGame();
            } else {
                shoot();
            }
        });

        window.addEventListener('mousedown', (e) => {
            if (state.active && e.target.tagName !== 'BUTTON') shoot();
        });

        function startGame() {
            state.active = true;
            state.hp = 100;
            state.score = 0;
            actionBtn.innerText = "ОГОНЬ";
            spawnWave();
            gameLoop();
        }

        function spawnWave() {
            world.innerHTML = '';
            state.enemyCount = 5;
            countEl.innerText = state.enemyCount;

            // Спавним врагов
            for (let i = 0; i < 5; i++) createEntity('enemy');
            
            // Спавним бонус
            createEntity('bonus');
        }

        function createEntity(type) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 5 + Math.random() * 7;
            const x = Math.sin(angle) * dist;
            const z = -Math.cos(angle) * dist;
            const y = (Math.random() - 0.5) * 4 + 1.5;

            const container = document.createElement('a-entity');
            container.setAttribute('class', `target ${type}`);
            container.setAttribute('position', `${x} ${y} ${z}`);
            container.setAttribute('geometry', 'primitive: sphere; radius: 1');
            container.setAttribute('material', 'visible: false');

            const sprite = document.createElement('a-image');
            sprite.setAttribute('src', type === 'enemy' ? '#enemy-img' : '#bonus-img');
            sprite.setAttribute('scale', type === 'enemy' ? '2.5 2.5 2.5' : '1.5 1.5 1.5');
            sprite.setAttribute('look-at', '[camera]');
            
            container.appendChild(sprite);
            world.appendChild(container);
        }

        function shoot() {
            // Обычный звук выстрела для всех нажатий
            shotSound.currentTime = 0;
            shotSound.play().catch(() => {});
            
            flash.style.opacity = '0.4';
            setTimeout(() => flash.style.opacity = '0', 50);

            const raycaster = camera.components.raycaster;
            const intersections = raycaster.intersections;

            if (intersections.length > 0) {
                const hit = intersections[0].object.el;
                if (hit.classList.contains('enemy')) {
                    killEnemy(hit);
                } else if (hit.classList.contains('bonus')) {
                    takeBonus(hit);
                }
            }
        }

        function killEnemy(el) {
            if (el.getAttribute('data-dead')) return;
            el.setAttribute('data-dead', 'true');
            state.score += 100;
            state.enemyCount--;
            scoreEl.innerText = state.score;
            countEl.innerText = state.enemyCount;
            
            animateRemoval(el);
            if (state.enemyCount <= 0) spawnWave();
        }

        function takeBonus(el) {
            if (el.getAttribute('data-dead')) return;
            el.setAttribute('data-dead', 'true');
            
            // Магический звук при подборе бонуса
            magicSound.currentTime = 0;
            magicSound.play().catch(() => {});
            
            // Эффект исцеления
            healOverlay.style.opacity = '1';
            setTimeout(() => healOverlay.style.opacity = '0', 300);

            state.hp = Math.min(100, state.hp + 20);
            updateHPUI();
            animateRemoval(el);
        }

        function animateRemoval(el) {
            let s = 1;
            const interval = setInterval(() => {
                s -= 0.1;
                el.setAttribute('scale', `${s} ${s} ${s}`);
                if (s <= 0) {
                    clearInterval(interval);
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
            }, 20);
        }

        function updateHPUI() {
            hpFill.style.width = `${state.hp}%`;
            hpText.innerText = `${Math.round(state.hp)} / 100`;
            if (state.hp <= 0) endGame();
        }

        function endGame() {
            state.active = false;
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').innerText = `Ваш счет: ${state.score}`;
        }

        function gameLoop() {
            if (!state.active) return;

            const enemies = document.querySelectorAll('.enemy');
            let beingAttacked = false;

            enemies.forEach(enemy => {
                const position = enemy.object3D.position.clone();
                const cameraObj = camera.getObject3D('camera');
                cameraObj.updateMatrix();
                cameraObj.updateMatrixWorld();
                
                const frustum = new THREE.Frustum();
                frustum.setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(cameraObj.projectionMatrix, cameraObj.matrixWorldInverse));

                if (frustum.containsPoint(position)) {
                    beingAttacked = true;
                }
            });

            if (beingAttacked) {
                state.hp -= 0.3;
                damageOverlay.classList.add('taking-damage');
                updateHPUI();
            } else {
                damageOverlay.classList.remove('taking-damage');
            }

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
