<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Охотник на Спрайтов AR</title>
    <!-- Основные библиотеки для AR и 3D -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .interactive { pointer-events: auto; }
        
        /* Стилизация прицела */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; pointer-events: none;
        }
        #crosshair svg { fill: none; stroke: #ff0000; stroke-width: 2; filter: drop-shadow(0 0 5px red); }

        /* Вспышка при выстреле */
        #muzzle-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            opacity: 0; pointer-events: none; z-index: 50;
        }

        .hud-text { text-shadow: 2px 2px 0px #000; color: #00ff00; }
        
        /* Анимация отдачи камеры */
        .recoil { animation: recoil-anim 0.1s ease-out; }
        @keyframes recoil-anim {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="muzzle-flash"></div>

    <div id="ui-container">
        <!-- Верхняя панель HUD -->
        <div class="p-6 flex justify-between items-start">
            <div class="bg-black/60 p-4 rounded border-l-4 border-green-500 backdrop-blur-sm">
                <div class="hud-text text-sm uppercase tracking-widest">Обнаружено целей</div>
                <div id="count-display" class="hud-text text-3xl font-bold">0</div>
            </div>
            <div class="bg-black/60 p-4 rounded border-r-4 border-red-500 backdrop-blur-sm text-right">
                <div class="hud-text text-sm uppercase tracking-widest text-red-400">Счет охоты</div>
                <div id="score-display" class="hud-text text-3xl font-bold text-red-500">0000</div>
            </div>
        </div>

        <!-- Центральный прицел -->
        <div id="crosshair">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" />
                <line x1="50" y1="0" x2="50" y2="20" />
                <line x1="50" y1="80" x2="50" y2="100" />
                <line x1="0" y1="50" x2="20" y2="50" />
                <line x1="80" y1="50" x2="100" y2="50" />
                <circle cx="50" cy="50" r="2" fill="red" />
            </svg>
        </div>

        <!-- Нижняя панель управления -->
        <div class="p-10 flex flex-col items-center gap-4">
            <div id="hint" class="hud-text text-center bg-black/40 px-4 py-1 rounded animate-pulse">
                Вращайте устройство, чтобы найти цель
            </div>
            <button id="action-btn" class="interactive bg-red-600 hover:bg-red-500 text-white font-black py-5 px-12 rounded shadow-[0_0_20px_rgba(220,38,38,0.5)] active:scale-90 transition-all border-2 border-red-400 uppercase tracking-tighter italic">
                Искать сигналы
            </button>
        </div>
    </div>

    <!-- AR Сцена -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;" 
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true; colorManagement: true;">
        
        <a-assets>
            <!-- Тот самый спрайт -->
            <img id="enemy-sprite" src="InShot_20260401_114755983.png" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=fallback'">
        </a-assets>

        <!-- Камера игрока -->
        <a-entity id="main-camera" camera look-controls raycaster="objects: .target; far: 50" cursor="rayOrigin: mouse; fuse: false">
            <!-- Звуковые эффекты можно добавить здесь -->
        </a-entity>

        <!-- Контейнер для спавна врагов -->
        <a-entity id="target-container"></a-entity>
    </a-scene>

    <script>
        const state = {
            score: 0,
            targetsCount: 0,
            isScanning: false,
            highScore: 0
        };

        const actionBtn = document.getElementById('action-btn');
        const container = document.getElementById('target-container');
        const scoreDisplay = document.getElementById('score-display');
        const countDisplay = document.getElementById('count-display');
        const flash = document.getElementById('muzzle-flash');
        const hint = document.getElementById('hint');

        // Клик по кнопке старта
        actionBtn.addEventListener('click', () => {
            if (!state.isScanning) {
                startHunt();
            } else {
                shoot();
            }
        });

        function startHunt() {
            state.isScanning = true;
            actionBtn.innerText = "ОГОНЬ!";
            actionBtn.classList.replace('bg-red-600', 'bg-orange-600');
            hint.innerText = "ЦЕЛЬ ОБНАРУЖЕНА В СЕКТОРЕ";
            spawnWave(3);
        }

        function spawnWave(num) {
            container.innerHTML = '';
            state.targetsCount = num;
            updateHUD();

            for (let i = 0; i < num; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 6 + Math.random() * 8;
                const x = Math.sin(angle) * dist;
                const z = -Math.cos(angle) * dist;
                const y = (Math.random() - 0.5) * 5 + 1;

                const enemy = document.createElement('a-image');
                enemy.setAttribute('src', '#enemy-sprite');
                enemy.setAttribute('class', 'target');
                enemy.setAttribute('position', `${x} ${y} ${z}`);
                enemy.setAttribute('scale', '2.5 2.5 2.5');
                enemy.setAttribute('look-at', '[camera]'); // Спрайт всегда к игроку
                enemy.setAttribute('material', 'transparent: true; alphaTest: 0.5; opacity: 1');
                
                // Добавляем хитбокс
                enemy.addEventListener('mousedown', function(e) {
                    onHit(this);
                });

                container.appendChild(enemy);
            }
        }

        function shoot() {
            // Эффект отдачи в UI
            document.getElementById('ui-container').classList.remove('recoil');
            void document.getElementById('ui-container').offsetWidth;
            document.getElementById('ui-container').classList.add('recoil');

            // Вспышка
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 50);

            // Вибрация
            if (navigator.vibrate) navigator.vibrate(30);

            // Звук выстрела можно добавить здесь
        }

        function onHit(el) {
            if (el.getAttribute('data-dead')) return;
            el.setAttribute('data-dead', 'true');

            // Эффект "смерти": растворение и уменьшение
            let op = 1;
            let s = 2.5;
            const anim = setInterval(() => {
                op -= 0.1;
                s -= 0.1;
                el.setAttribute('material', 'opacity', op);
                el.setAttribute('scale', `${s} ${s} ${s}`);
                
                if (op <= 0) {
                    clearInterval(anim);
                    el.parentNode.removeChild(el);
                    state.score += 500;
                    state.targetsCount--;
                    updateHUD();
                    
                    if (state.targetsCount <= 0) {
                        finishWave();
                    }
                }
            }, 30);
        }

        function updateHUD() {
            scoreDisplay.innerText = state.score.toString().padStart(4, '0');
            countDisplay.innerText = state.targetsCount;
        }

        function finishWave() {
            hint.innerText = "СЕКТОР ЗАЧИЩЕН";
            actionBtn.innerText = "СЛЕДУЮЩАЯ ВОЛНА";
            actionBtn.classList.replace('bg-orange-600', 'bg-green-600');
            state.isScanning = false;
        }

        // Обработка клика по всему экрану (стрельба)
        window.addEventListener('mousedown', (e) => {
            if (state.isScanning && e.target.tagName === 'CANVAS') {
                shoot();
            }
        });
    </script>
</body>
</html>
