<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Highway Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            font-size: 24px; font-weight: bold; z-index: 10; pointer-events: none;
            text-shadow: 2px 2px 4px #000;
        }
        #restartBtn {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); padding: 20px 40px;
            font-size: 28px; background: #ff4444; color: white; border: none; 
            border-radius: 12px; z-index: 20; cursor: pointer;
        }
        #touch-left, #touch-right { position: absolute; top: 0; width: 50%; height: 100%; z-index: 5; }
        #touch-right { right: 0; }
    </style>
</head>
<body>

    <div id="ui">ЖИЗНИ: <span id="lives">2</span> | СЧЁТ: <span id="score">0</span></div>
    <button id="restartBtn" onclick="location.reload()">ИГРАТЬ СНОВА</button>
    
    <div id="touch-left"></div>
    <div id="touch-right"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, playerCar;
        let lives = 2, score = 0, isGameOver = false;
        let obstacles = [];
        const speed = 0.75;
        const roadWidth = 10;
        const laneWidth = roadWidth / 3;

        // Физика игрока
        let targetX = 0;
        const originalCamPos = new THREE.Vector3(0, 4, 7);
        let shakeTime = 0;

        const listener = new THREE.AudioListener();
        const audioLoader = new THREE.AudioLoader();
        const sounds = {};

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(originalCamPos);
            camera.lookAt(0, 0, -5);
            camera.add(listener);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(5, 15, 5);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            loadAssets();
            setupControls();
            createEnvironment();
            animate();
            spawnLoop();
        }

        function loadAssets() {
            const loader = new THREE.GLTFLoader();
            loader.load('models/dirty_car_061220.glb', (gltf) => {
                playerCar = gltf.scene;
                playerCar.scale.set(0.6, 0.6, 0.6);
                playerCar.rotation.y = Math.PI;
                scene.add(playerCar);
            });

            loadSound('engine', 'sounds/engine.mp3', true, 0.2);
            loadSound('hit_enemy', 'sounds/enemy_hit.mp3', false, 0.8);
            loadSound('hit_friend', 'sounds/friend_hit.mp3', false, 0.8);
        }

        function loadSound(name, path, loop, vol) {
            const s = new THREE.Audio(listener);
            audioLoader.load(path, (buffer) => {
                s.setBuffer(buffer); s.setLoop(loop); s.setVolume(vol);
                sounds[name] = s;
                if(name === 'engine') s.play();
            });
        }

        function setupControls() {
            const move = (dir) => {
                targetX += dir * laneWidth;
                targetX = THREE.MathUtils.clamp(targetX, -laneWidth, laneWidth);
            };

            document.getElementById('touch-left').addEventListener('touchstart', (e) => { e.preventDefault(); move(-1); });
            document.getElementById('touch-right').addEventListener('touchstart', (e) => { e.preventDefault(); move(1); });
            window.addEventListener('keydown', (e) => {
                if(e.code === "ArrowLeft") move(-1);
                if(e.code === "ArrowRight") move(1);
            });
        }

        function createEnvironment() {
            const texLoader = new THREE.TextureLoader();
            
            // Небо
            scene.background = new THREE.Color(0x1a1a2e);

            // Дорога
            const roadTex = texLoader.load('models/grey-speckled-texture_1375194-6389.jpg');
            roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
            roadTex.repeat.set(1, 100);
            const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, 2000), new THREE.MeshLambertMaterial({ map: roadTex }));
            road.rotation.x = -Math.PI/2;
            road.name = "road";
            scene.add(road);

            // Здания
            const bMat = new THREE.MeshLambertMaterial({ map: texLoader.load('models/i.jpeg') });
            bMat.map.wrapT = THREE.RepeatWrapping; bMat.map.repeat.set(1, 50);
            const bGeo = new THREE.BoxGeometry(15, 40, 2000);
            
            const leftB = new THREE.Mesh(bGeo, bMat); leftB.position.set(-12.5, 19.8, -950); scene.add(leftB);
            const rightB = new THREE.Mesh(bGeo, bMat); rightB.position.set(12.5, 19.8, -950); scene.add(rightB);
        }

        function spawnObstacle() {
            if(isGameOver) return;
            const isEnemy = Math.random() > 0.4;
            const tex = new THREE.TextureLoader().load(isEnemy ? 'models/InShot_20260324_120003547.png' : 'models/InShot_20260325_150717238.png');
            const obj = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 0.2), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
            
            obj.position.set((Math.floor(Math.random()*3)-1)*laneWidth, 0.8, -60);
            // Добавляем доп. данные для физики "полета"
            obj.userData = { 
                type: isEnemy ? 'enemy' : 'friend', 
                hit: false,
                vY: 0, vX: 0, vR: 0 
            };
            scene.add(obj);
            obstacles.push(obj);
            setTimeout(spawnLoop, 1100);
        }
        function spawnLoop() { spawnObstacle(); }

        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            // 1. ПЛАВНОЕ ДВИЖЕНИЕ И НАКЛОН МАШИНЫ
            if(playerCar) {
                // Плавное следование за targetX (LERP)
                playerCar.position.x = THREE.MathUtils.lerp(playerCar.position.x, targetX, 0.15);
                
                // Наклон кузова при повороте
                const tilt = (targetX - playerCar.position.x) * 0.2;
                playerCar.rotation.z = THREE.MathUtils.lerp(playerCar.rotation.z, tilt, 0.1);
            }

            // 2. ТРЯСКА КАМЕРЫ
            if(shakeTime > 0) {
                camera.position.x = originalCamPos.x + (Math.random()-0.5)*0.5;
                camera.position.y = originalCamPos.y + (Math.random()-0.5)*0.5;
                shakeTime -= 0.02;
            } else {
                camera.position.lerp(originalCamPos, 0.1);
            }

            // Дорога едет
            const road = scene.getObjectByName("road");
            if(road) road.material.map.offset.y -= 0.05;

            // 3. ФИЗИКА ПРЕПЯТСТВИЙ
            obstacles.forEach((obj, index) => {
                if(!obj.userData.hit) {
                    obj.position.z += speed;

                    // Коллизия
                    if(playerCar && obj.position.distanceTo(playerCar.position) < 1.4) {
                        obj.userData.hit = true;
                        if(obj.userData.type === 'enemy') {
                            score += 10;
                            if(sounds.hit_enemy) sounds.hit_enemy.play();
                            // Физика отлета врага
                            obj.userData.vY = 0.5; 
                            obj.userData.vX = (Math.random() - 0.5) * 0.5;
                            obj.userData.vR = Math.random() * 0.2;
                        } else {
                            lives--;
                            shakeTime = 0.3;
                            if(navigator.vibrate) navigator.vibrate(100); // ВИБРАЦИЯ
                            if(sounds.hit_friend) sounds.hit_friend.play();
                            if(lives <= 0) endGame();
                        }
                        document.getElementById('lives').innerText = lives;
                        document.getElementById('score').innerText = score;
                    }
                } else {
                    // Эффект отлетающего врага
                    obj.position.y += obj.userData.vY;
                    obj.position.x += obj.userData.vX;
                    obj.position.z -= 0.2;
                    obj.rotation.z += obj.userData.vR;
                    obj.userData.vY -= 0.02; // гравитация
                }
                
                if(obj.position.z > 10 || obj.position.y < -5) {
                    scene.remove(obj);
                    obstacles.splice(index, 1);
                }
            });

            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('restartBtn').style.display = 'block';
            if(sounds.engine) sounds.engine.stop();
        }

        window.onload = init;
    </script>
</body>
</html>
