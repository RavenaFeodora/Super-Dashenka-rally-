<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Побег: 3D Маньяк найден</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        
        #ui {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            color: white;
            user-select: none;
        }

        #move-zone { position: absolute; bottom: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; }
        #look-zone { position: absolute; bottom: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }

        .joystick-base {
            position: absolute;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: none;
        }
        .joystick-stick {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #action-btn {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 50px;
            background: #8b0000;
            color: white;
            border: 2px solid white;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            display: none;
            pointer-events: auto;
            z-index: 50;
        }

        #hud {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-left: 5px solid #8b0000;
        }

        #timer-container {
            position: absolute;
            top: 20px; right: 20px;
            text-align: right;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }

        #timer {
            font-size: 36px;
            font-weight: bold;
            color: #ff0000;
        }

        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            background: black;
            text-align: center;
        }

        #death-screen { background: radial-gradient(circle, #500, #000); display: none; }
        #win-screen { background: radial-gradient(circle, #040, #000); display: none; }

        .btn-start {
            padding: 18px 50px;
            font-size: 24px;
            background: #8b0000;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            margin-top: 20px;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 200;
        }
    </style>
</head>
<body>

<div id="loading">
    <div>ЗАГРУЗКА ОБЪЕКТОВ...</div>
    <div id="load-status" style="font-size: 12px; margin-top: 10px; color: #666;">Ожидание...</div>
</div>

<div id="start-screen" class="screen" style="display: none;">
    <h1 style="color: #8b0000;">УЖАС В КЛЕТКЕ</h1>
    <p style="color: #ccc;">Таймер: 3 минуты. Ключ снаружи.<br>Маньяк уже близко.</p>
    <button class="btn-start" id="start-btn">ИГРАТЬ</button>
</div>

<div id="death-screen" class="screen">
    <h1 id="death-reason" style="font-size: 60px; color: white;">ТЕБЯ ПОЙМАЛИ</h1>
    <button class="btn-start" onclick="location.reload()">ЗАНОВО</button>
</div>

<div id="win-screen" class="screen">
    <h1 style="font-size: 60px; color: #0f0;">СВОБОДА!</h1>
    <button class="btn-start" onclick="location.reload()">В МЕНЮ</button>
</div>

<div id="ui">
    <div id="hud">ЦЕЛЬ: НАЙТИ КЛЮЧ</div>
    <div id="timer-container">
        <div id="timer">03:00</div>
    </div>
    <div id="crosshair"></div>
    <button id="action-btn">ДЕЙСТВИЕ</button>
    
    <div id="move-zone"><div id="joy-base" class="joystick-base"><div id="joy-stick" class="joystick-stick"></div></div></div>
    <div id="look-zone"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    const ASSETS = {
        wall: 'https://img.freepik.com/free-photo/old-dirty-grunge-cement-wall-background-concrete-wall-dirty-background_9635-715.jpg',
        floor: 'https://static.vecteezy.com/system/resources/thumbnails/002/106/179/small/grunge-dark-concrete-floor-background-free-photo.jpg',
        maniacModel: 'maniacman1.glb',
        key: 'InShot_20260325_221848071.png',
        door: 'i.jpeg',
        ambient: 'Звук заброшенной психбольницы или тюрьмы.mp3',
        killerWalk: '8544f71d5178535.mp3',
        killerLaugh: 'zlobnyy-smeh-dyavola.mp3'
    };

    let scene, camera, renderer, clock;
    let moveVector = new THREE.Vector2(0, 0);
    let player = { h: 1.6, speed: 0.08, hasKey: false, escaped: false };
    let killer, killerAudio, ambientSound, laughSound, mixer;
    let cellDoor, interactables = [];
    let isGameOver = false, gameStarted = false;
    let timeLeft = 180;

    let moveTouchId = null, lookTouchId = null;
    let lastLookPos = new THREE.Vector2();

    function init() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, player.h, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();
        const gltfLoader = new THREE.GLTFLoader();
        
        // --- СВЕТ (Сделал ярче для видимости модели) ---
        const mainLight = new THREE.PointLight(0xffffff, 2, 60);
        mainLight.position.set(0, 8, 0);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const hemLight = new THREE.HemisphereLight(0x444444, 0x000000, 1.2);
        scene.add(hemLight);

        // Пол
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshPhongMaterial({ map: loader.load(ASSETS.floor) }));
        floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
        scene.add(floor);

        // Стены
        const wallMat = new THREE.MeshPhongMaterial({ map: loader.load(ASSETS.wall) });
        const addW = (w, h, x, z, ry=0) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), wallMat);
            m.position.set(x, h/2, z); m.rotation.y = ry;
            scene.add(m);
        };
        addW(30, 8, 0, -15); addW(30, 8, 0, 15);
        addW(30, 8, -15, 0, Math.PI/2); addW(30, 8, 15, 0, Math.PI/2);

        // Клетка
        const barMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
        const barGeo = new THREE.CylinderGeometry(0.04, 0.04, 6);
        for(let i=-2.5; i<=2.5; i+=0.5) {
            const bF = new THREE.Mesh(barGeo, barMat); bF.position.set(i, 3, 2.5); scene.add(bF);
            const bB = new THREE.Mesh(barGeo, barMat); bB.position.set(i, 3, -2.5); scene.add(bB);
            const bL = new THREE.Mesh(barGeo, barMat); bL.position.set(-2.5, 3, i); scene.add(bL);
            const bR = new THREE.Mesh(barGeo, barMat); bR.position.set(2.5, 3, i); scene.add(bR);
        }

        // Замок
        cellDoor = new THREE.Group();
        const lock = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.3), new THREE.MeshPhongMaterial({ color: 0xaa9900 }));
        lock.name = "LOCK"; lock.userData = { type: 'lock' };
        cellDoor.add(new THREE.Mesh(barGeo, barMat), lock);
        cellDoor.position.set(0, 3, 2.5);
        scene.add(cellDoor);
        interactables.push(lock);

        // Ключ
        const keyMat = new THREE.MeshPhongMaterial({ map: loader.load(ASSETS.key), transparent: true });
        const key = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.4), keyMat);
        key.position.set(5.5, 0.1, 0);
        key.name = "KEY"; key.userData = { type: 'key' };
        scene.add(key);
        interactables.push(key);

        // Выход
        const exitMat = new THREE.MeshPhongMaterial({ map: loader.load(ASSETS.door) });
        const exit = new THREE.Mesh(new THREE.BoxGeometry(3, 5, 0.2), exitMat);
        exit.position.set(0, 2.5, -14.7);
        exit.name = "EXIT"; exit.userData = { type: 'exit' };
        scene.add(exit);
        interactables.push(exit);

        // --- ЗАГРУЗКА МАНЬЯКА ---
        document.getElementById('load-status').innerText = "Загрузка maniacman1.glb...";
        gltfLoader.load(ASSETS.maniacModel, (gltf) => {
            killer = gltf.scene;
            
            // Авто-масштабирование: вписываем модель в нужный размер
            const box = new THREE.Box3().setFromObject(killer);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2.5 / maxDim; // Рост маньяка будет около 2.5 метров
            killer.scale.set(scale, scale, scale);
            
            // Центрируем модель по Y, чтобы стояла на полу
            killer.position.set(-10, 0, 10);
            
            killer.traverse(n => { 
                if(n.isMesh) {
                    n.castShadow = true;
                    n.receiveShadow = true;
                    // Исправление материалов, если они слишком темные
                    if(n.material) {
                        n.material.emissiveIntensity = 0;
                        n.material.needsUpdate = true;
                    }
                } 
            });
            
            scene.add(killer);

            if(gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(killer);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            
            setupAudio();
        }, (xhr) => {
            const p = Math.round(xhr.loaded / xhr.total * 100);
            document.getElementById('load-status').innerText = `Загрузка: ${p}%`;
        }, (error) => {
            console.error("Ошибка:", error);
            document.getElementById('load-status').innerText = "Ошибка загрузки GLB. Проверьте имя файла.";
        });

        setupControls();
        animate();
    }

    function setupControls() {
        const joyBase = document.getElementById('joy-base');
        const joyStick = document.getElementById('joy-stick');

        const onTouchStart = (e) => {
            for(let t of e.changedTouches) {
                if(t.clientX < window.innerWidth/2 && moveTouchId === null) {
                    moveTouchId = t.identifier;
                    joyBase.style.display = 'block';
                    joyBase.style.left = (t.clientX - 60) + 'px';
                    joyBase.style.top = (t.clientY - 60) + 'px';
                } else if(t.clientX >= window.innerWidth/2 && lookTouchId === null) {
                    lookTouchId = t.identifier;
                    lastLookPos.set(t.clientX, t.clientY);
                }
            }
        };

        window.addEventListener('touchstart', onTouchStart);

        window.addEventListener('touchmove', (e) => {
            for(let t of e.changedTouches) {
                if(t.identifier === moveTouchId) {
                    const bx = parseInt(joyBase.style.left) + 60;
                    const by = parseInt(joyBase.style.top) + 60;
                    let dx = t.clientX - bx, dy = t.clientY - by;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if(d > 50) { dx *= 50/d; dy *= 50/d; }
                    joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    moveVector.set(dx/50, dy/50);
                } else if(t.identifier === lookTouchId) {
                    camera.rotation.y -= (t.clientX - lastLookPos.x) * 0.007;
                    camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - (t.clientY - lastLookPos.y) * 0.007));
                    lastLookPos.set(t.clientX, t.clientY);
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for(let t of e.changedTouches) {
                if(t.identifier === moveTouchId) { moveTouchId = null; joyBase.style.display = 'none'; moveVector.set(0,0); }
                else if(t.identifier === lookTouchId) { lookTouchId = null; }
            }
        });

        document.getElementById('action-btn').addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            handleInteraction(); 
        });

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('start-screen').style.display = 'none';
            gameStarted = true;
            if(ambientSound && ambientSound.buffer) ambientSound.play();
            if(killerAudio && killerAudio.buffer) killerAudio.play();
            startTimer();
        };
    }

    function handleInteraction() {
        const obj = getLookTarget();
        if(!obj) return;
        if(obj.userData.type === 'key') {
            player.hasKey = true; scene.remove(obj);
            document.getElementById('hud').innerText = "ЦЕЛЬ: ОТКРЫТЬ КЛЕТКУ (НА ЗАМОК)";
        } else if(obj.userData.type === 'lock' && player.hasKey) {
            player.escaped = true; cellDoor.visible = false;
            document.getElementById('hud').innerText = "ЦЕЛЬ: БЕГИ К ДВЕРИ!";
        } else if(obj.userData.type === 'exit' && player.escaped) {
            isGameOver = true; document.getElementById('win-screen').style.display = 'flex';
        }
    }

    function setupAudio() {
        const listener = new THREE.AudioListener();
        camera.add(listener);
        const loader = new THREE.AudioLoader();
        
        ambientSound = new THREE.Audio(listener);
        loader.load(ASSETS.ambient, b => { ambientSound.setBuffer(b); ambientSound.setLoop(true); });
        
        killerAudio = new THREE.PositionalAudio(listener);
        loader.load(ASSETS.killerWalk, b => { 
            killerAudio.setBuffer(b); 
            killerAudio.setLoop(true); 
            killerAudio.setRefDistance(2); 
        });
        if(killer) killer.add(killerAudio);
        
        laughSound = new THREE.Audio(listener);
        loader.load(ASSETS.killerLaugh, b => laughSound.setBuffer(b));
    }

    function getLookTarget() {
        const ray = new THREE.Raycaster();
        ray.setFromCamera(new THREE.Vector2(0,0), camera);
        const hits = ray.intersectObjects(interactables);
        return (hits.length > 0 && hits[0].distance < 7.0) ? hits[0].object : null;
    }

    function startTimer() {
        const timerInt = setInterval(() => {
            if(isGameOver) { clearInterval(timerInt); return; }
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            if(timeLeft <= 0) { clearInterval(timerInt); die("ВРЕМЯ ВЫШЛО"); }
        }, 1000);
    }

    function die(reason) {
        if(isGameOver) return;
        isGameOver = true;
        document.getElementById('death-reason').innerText = reason;
        document.getElementById('death-screen').style.display = 'flex';
        if(laughSound && laughSound.buffer) laughSound.play();
    }

    function animate() {
        const delta = clock.getDelta();
        if(isGameOver || !gameStarted) { 
            if(renderer) renderer.render(scene, camera);
            requestAnimationFrame(animate); 
            return; 
        }
        requestAnimationFrame(animate);

        if(mixer) mixer.update(delta);

        if(moveVector.length() > 0) {
            const f = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            const s = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
            f.y = 0; s.y = 0; f.normalize(); s.normalize();
            camera.position.add(s.multiplyScalar(moveVector.x * player.speed));
            camera.position.add(f.multiplyScalar(-moveVector.y * player.speed));
        }

        const bLimit = player.escaped ? 14.2 : 2.2;
        camera.position.x = Math.max(-bLimit, Math.min(bLimit, camera.position.x));
        camera.position.z = Math.max(-bLimit, Math.min(bLimit, camera.position.z));

        if(killer) {
            const time = Date.now() * 0.0005;
            const orbitRadius = 11;
            const nextX = Math.sin(time) * orbitRadius;
            const nextZ = Math.cos(time) * orbitRadius;
            
            // Плавный поворот к следующей точке пути
            killer.lookAt(nextX, 0, nextZ);
            killer.position.set(nextX, 0, nextZ);

            if(camera.position.distanceTo(killer.position) < 2.5) die("ТЕБЯ ПОЙМАЛИ");
        }

        const target = getLookTarget();
        document.getElementById('action-btn').style.display = target ? 'block' : 'none';

        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
