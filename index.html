<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Highway Survivor</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute; top: env(safe-area-inset-top, 20px); left: 20px; 
            color: white; font-size: 24px; font-weight: bold; z-index: 10; 
            pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #restartBtn {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); padding: 20px 40px;
            font-size: 28px; background: #ff4444; color: white; border: none; 
            border-radius: 12px; z-index: 20; cursor: pointer; box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        #touch-left, #touch-right {
            position: absolute; top: 0; width: 50%; height: 100%; z-index: 5;
        }
        #touch-right { right: 0; }
    </style>
</head>
<body>

    <div id="ui">ЖИЗНИ: <span id="lives">2</span> | СЧЁТ: <span id="score">0</span></div>
    <button id="restartBtn" onclick="location.reload()">ИГРАТЬ СНОВА</button>
    
    <div id="touch-left"></div>
    <div id="touch-right"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, playerCar;
        let lives = 2, score = 0, isGameOver = false;
        let obstacles = [];
        const speed = 0.7; // Скорость игры
        const roadWidth = 10;
        const laneWidth = roadWidth / 3;

        // Аудио
        const listener = new THREE.AudioListener();
        const audioLoader = new THREE.AudioLoader();
        const sounds = {};

        // Переменные для тряски
        let shakeTime = 0;
        let shakeIntensity = 0;
        const originalCamPos = new THREE.Vector3(0, 4, 7);

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.copy(originalCamPos);
            camera.lookAt(0, 0, -5);
            camera.add(listener);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Свет
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(10, 20, 10);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            loadAssets();
            setupControls();
            createEnvironment();
            animate();
            spawnLoop();

            window.addEventListener('resize', onWindowResize);
        }

        function loadAssets() {
            const loader = new THREE.GLTFLoader();
            loader.load('models/dirty_car_061220.glb', (gltf) => {
                playerCar = gltf.scene;
                playerCar.scale.set(0.6, 0.6, 0.6);
                playerCar.rotation.y = Math.PI;
                playerCar.position.y = 0.3;
                scene.add(playerCar);
            });

            // Звуки (Убедись в правильности путей)
            loadSound('engine', 'sounds/engine.mp3', true, 0.2);
            loadSound('hit_enemy', 'sounds/enemy_hit.mp3', false, 0.7);
            loadSound('hit_friend', 'sounds/friend_hit.mp3', false, 0.7);
        }

        function loadSound(name, path, loop, vol) {
            const s = new THREE.Audio(listener);
            audioLoader.load(path, (buffer) => {
                s.setBuffer(buffer);
                s.setLoop(loop);
                s.setVolume(vol);
                sounds[name] = s;
                if(name === 'engine') s.play();
            }, undefined, (err) => console.log("Звук не найден: " + path));
        }

        function setupControls() {
            const moveLeft = () => { if(playerCar && playerCar.position.x > -laneWidth) playerCar.position.x -= laneWidth; };
            const moveRight = () => { if(playerCar && playerCar.position.x < laneWidth) playerCar.position.x += laneWidth; };

            document.getElementById('touch-left').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
            document.getElementById('touch-right').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });

            window.addEventListener('keydown', (e) => {
                if(e.code === "ArrowLeft" || e.code === "KeyA") moveLeft();
                if(e.code === "ArrowRight" || e.code === "KeyD") moveRight();
            });
        }

        function createEnvironment() {
            const texLoader = new THREE.TextureLoader();
            
            // Небо (градиент)
            const canvas = document.createElement('canvas');
            canvas.width = 2; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#00111e'); grad.addColorStop(1, '#4584b4');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 2, 512);
            scene.background = new THREE.CanvasTexture(canvas);

            // Дорога
            const roadTex = texLoader.load('models/grey-speckled-texture_1375194-6389.jpg');
            roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
            roadTex.repeat.set(1, 150);
            const roadGeo = new THREE.PlaneGeometry(roadWidth, 3000);
            const roadMat = new THREE.MeshLambertMaterial({ map: roadTex });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -1450;
            road.name = "road";
            scene.add(road);

            // Здания (БЕЗ ПРОСВЕТОВ)
            const bldgTex = texLoader.load('models/i.jpeg');
            bldgTex.wrapS = bldgTex.wrapT = THREE.RepeatWrapping;
            bldgTex.repeat.set(1, 80);
            
            const bldgGeo = new THREE.BoxGeometry(15, 40, 3000);
            const bldgMat = new THREE.MeshLambertMaterial({ map: bldgTex });

            const leftB = new THREE.Mesh(bldgGeo, bldgMat);
            leftB.position.set(-12.5, 19.8, -1450); // Прижато к дороге (5 + 7.5 = 12.5)
            scene.add(leftB);

            const rightB = new THREE.Mesh(bldgGeo, bldgMat);
            rightB.position.set(12.5, 19.8, -1450);
            scene.add(rightB);
        }

        function spawnObstacle() {
            if(isGameOver) return;
            const isEnemy = Math.random() > 0.4;
            const tex = new THREE.TextureLoader().load(isEnemy ? 'models/InShot_20260324_120003547.png' : 'models/InShot_20260325_150717238.png');
            const geo = new THREE.BoxGeometry(1.6, 1.6, 0.2);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
            const obj = new THREE.Mesh(geo, mat);
            
            const lanes = [-laneWidth, 0, laneWidth];
            obj.position.set(lanes[Math.floor(Math.random()*3)], 0.8, -60);
            obj.userData = { type: isEnemy ? 'enemy' : 'friend' };
            scene.add(obj);
            obstacles.push(obj);
            
            setTimeout(spawnLoop, 1000 + Math.random() * 500);
        }

        function spawnLoop() { spawnObstacle(); }

        // Функция запуска тряски
        function triggerShake(intensity, duration) {
            shakeIntensity = intensity;
            shakeTime = duration;
        }

        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            // Эффект бесконечной дороги
            const road = scene.getObjectByName("road");
            if(road) road.material.map.offset.y -= 0.04;

            // Логика тряски камеры
            if (shakeTime > 0) {
                camera.position.x = originalCamPos.x + (Math.random() - 0.5) * shakeIntensity;
                camera.position.y = originalCamPos.y + (Math.random() - 0.5) * shakeIntensity;
                shakeTime -= 0.016; // Примерно 1 кадр при 60fps
            } else {
                camera.position.copy(originalCamPos);
            }

            obstacles.forEach((obj, index) => {
                obj.position.z += speed;
                
                if(playerCar && obj.position.distanceTo(playerCar.position) < 1.3) {
                    if(obj.userData.type === 'enemy') {
                        score += 10;
                        if(sounds.hit_enemy) { sounds.hit_enemy.stop(); sounds.hit_enemy.play(); }
                    } else {
                        lives--;
                        triggerShake(0.5, 0.3); // ТРЯСКА ПРИ УДАРЕ ДРУГА
                        if(sounds.hit_friend) { sounds.hit_friend.stop(); sounds.hit_friend.play(); }
                        if(lives <= 0) endGame();
                    }
                    scene.remove(obj);
                    obstacles.splice(index, 1);
                    document.getElementById('lives').innerText = lives;
                    document.getElementById('score').innerText = score;
                }
                
                if(obj.position.z > 10) {
                    scene.remove(obj);
                    obstacles.splice(index, 1);
                }
            });

            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('restartBtn').style.display = 'block';
            if(sounds.engine) sounds.engine.stop();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
